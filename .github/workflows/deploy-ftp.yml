name: Deploy to Hostinger FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-ftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: /public_html/
          dangerous-clean-slate: false
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.github/**/*
            **/.env
            **/.env.*
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/phpunit.xml
            **/.claude/**
            **/.cursor/**
            **/AGENTS.md
            **/CLAUDE.md
            **/deploy/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/app/private/**
            **/database/*.sqlite
            **/composer.lock
            **/.DS_Store
            **/Thumbs.db
            **/*.md
